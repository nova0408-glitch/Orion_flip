<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Modern Circular Clock</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Segoe UI", system-ui, sans-serif;
}

body {
  height: 100vh;
  background: radial-gradient(circle at center, #111 0%, #000 70%);
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

.clock {
  position: relative;
  width: 340px;
  height: 340px;
}

.ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: transform 0.4s linear;
}

.ring::before {
  content: "";
  position: absolute;
  top: -6px;
  left: 50%;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  transform: translateX(-50%);
}

.hours {
  border: 5px solid rgba(255,255,255,0.15);
}
.hours::before { background: #fff; }

.minutes {
  inset: 20px;
  border: 5px solid rgba(0,170,255,0.6);
  box-shadow: 0 0 20px rgba(0,170,255,0.4);
}
.minutes::before { background: #00aaff; }

.seconds {
  inset: 40px;
  border: 5px solid rgba(255,80,80,0.7);
  box-shadow: 0 0 25px rgba(255,80,80,0.6);
}
.seconds::before { background: #ff5050; }

.date {
  inset: 60px;
  border: 3px dashed rgba(255,255,255,0.25);
}

.center {
  position: absolute;
  inset: 95px;
  background: rgba(0,0,0,0.85);
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  letter-spacing: 2px;
}

.time {
  font-size: 1.6rem;
  font-weight: 600;
}

.day {
  font-size: 0.9rem;
  opacity: 0.7;
  margin-top: 6px;
}
</style>
</head>

<body>

<div class="clock">
  <div class="ring hours"></div>
  <div class="ring minutes"></div>
  <div class="ring seconds"></div>
  <div class="ring date"></div>

  <div class="center">
    <div class="time" id="digitalTime">00:00:00</div>
    <div class="day" id="dayText">MON · JAN 01</div>
  </div>
</div>

<script>
function updateClock() {
  const now = new Date();

  const h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();
  const d = now.getDate();

  const hourDeg = (h % 12) * 30 + m * 0.5;
  const minDeg  = m * 6;
  const secDeg  = s * 6;
  const dateDeg = d * 12;

  document.querySelector(".hours").style.transform =
    `rotate(${hourDeg}deg)`;
  document.querySelector(".minutes").style.transform =
    `rotate(${minDeg}deg)`;
  document.querySelector(".seconds").style.transform =
    `rotate(${secDeg}deg)`;
  document.querySelector(".date").style.transform =
    `rotate(${dateDeg}deg)`;

  document.getElementById("digitalTime").innerText =
    `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

  const days = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
  const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

  document.getElementById("dayText").innerText =
    `${days[now.getDay()]} · ${months[now.getMonth()]} ${String(d).padStart(2,"0")}`;
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
