<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORION FLIP CLOCK - 1992</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body class="crt">

  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="stars"></div>
  <div id="shooting-star" class="shooting-star"></div>

  <header class="terminal-header">
    ORION FLIP CLOCK v1.9 ── DAR ES SALAAM  ── 15 JAN 2026
  </header>

  <main>
    <div id="clock-container">
      <div class="flip-group" id="hours-tens"></div>
      <div class="flip-group" id="hours-ones"></div>
      <span class="colon">:</span>
      <div class="flip-group" id="minutes-tens"></div>
      <div class="flip-group" id="minutes-ones"></div>
      <span class="colon">:</span>
      <div class="flip-group" id="seconds-tens"></div>
      <div class="flip-group" id="seconds-ones"></div>
    </div>

    <div id="date-display" class="date-crt"></div>

    <div id="controls" class="retro-controls">
      <select id="mode-select">
        <option value="clock">CLOCK</option>
        <option value="timer">TIMER</option>
        <option value="stopwatch">STOPWATCH</option>
        <option value="alarm">ALARM</option>
      </select>

      <button id="zen-mode">ZEN</button>
      <button id="fullscreen-btn">FULL SCREEN</button>

      <select id="theme-select">
        <option value="amber">AMBER</option>
        <option value="green">GREEN</option>
        <option value="classic">CLASSIC</option>
        <option value="neon">NEON</option>
      </select>

      <label><input type="checkbox" id="sound-toggle" checked> BEEP</label>

      <div id="timer-input" class="mode-panel">
        <input type="number" id="timer-min" placeholder="MM" min="0">
        <input type="number" id="timer-sec" placeholder="SS" min="0" max="59">
        <button id="start-timer">START</button>
        <button id="pomodoro">POMODORO</button>
      </div>

      <div id="stopwatch-controls" class="mode-panel">
        <button id="start-stopwatch">START</button>
        <button id="lap">LAP</button>
        <button id="reset-stopwatch">RESET</button>
        <ul id="laps"></ul>
      </div>

      <div id="alarm-controls" class="mode-panel">
        <input type="time" id="alarm-time">
        <button id="set-alarm">SET</button>
        <ul id="alarms"></ul>
      </div>
    </div>
  </main>

  <audio id="flip-sound" src="sounds/flip.wav"></audio>
  <audio id="alarm-sound" src="sounds/alarm.mp3" loop></audio>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
